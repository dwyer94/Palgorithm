name: CI
on:
  pull_request:
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: service_role tripwire
        run: |
          if grep -rn "service_role" --include="*.ts" --include="*.tsx" src/; then
            echo "::error::service_role key reference found in client source"
            exit 1
          fi
