# Render blueprint (Phase 4, docs/PRODUCTION_READINESS_PLAN.md) — keeps hosting config
# in-repo/reproducible rather than only living in the Render dashboard, same treatment
# Supabase migrations already get. Create the site once via Render's "New Blueprint"
# flow pointed at this repo; env var values themselves are set in the dashboard
# (sync: false), never committed — same as the Supabase anon key's treatment in
# docs/DEPLOYING_GUIDE.md.
services:
  - type: web
    name: palgorithm
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      # Build-time only (not a VITE_ var, so it's never inlined into the bundle). Enables
      # source map upload in vite.config.ts; without it the build still succeeds and simply
      # emits no maps, which is what local and PR-preview builds do.
      - key: SENTRY_AUTH_TOKEN
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data:;
          connect-src 'self' https://ierlcetswgclqgdamshv.supabase.co https://o4509702392971264.ingest.us.sentry.io;
          object-src 'none';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none'
